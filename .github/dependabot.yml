version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'dtolnay/rust-toolchain'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # majors are migrated by hand: many are ESM-only now while our packages are CommonJS
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'monthly'
    ignore:
      # solana majors move together, gated by the version solana-client depends on
      - dependency-name: 'solana-*'
        update-types: ['version-update:semver-major']
