[package]
name = "solana-transaction-executor"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.92"
base64 = "0.22.1"
futures-core = "0.3"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "^0.12", features = ["json", "blocking"] }
serde_json = "1.0.149"
solana-client = "4.2.2"
solana-compute-budget-interface = "3"
solana-hash = "4.4"
solana-instruction = "3.4"
solana-signature = "3.4"
solana-signer = "3"
solana-transaction = { version = "4.1", features = ["wincode"] }
solana-transaction-error = "3.3"
solana-transaction-status-client-types = { version = "4.2.2", features = ["agave-unstable-api"] }
tokio = { version = "1", features = ["full"] }
wincode = "0.5.5"

[dev-dependencies]
solana-keypair = "3.1"
solana-message = "4.4"
